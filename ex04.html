<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        body {
            font: normal 20pt Arial;
        }
    </style>
<body>
    <script>
        const nome = window.prompt("Qual é o seu nome?")

        document.write(`Olá, <strong>${nome}</strong>. O seu nome tem ${nome.length} letras!</br>`)
        document.write(`O seu nome em maiúsculas é <strong>${nome.toUpperCase()}</strong>.</br>`)
        document.write(`O seu nome em minúsculas é <strong>${nome.toLowerCase()}</strong>.</br>`)
        
        const numero = Number(window.prompt("Digite um valor monetário.").replace(',', '.'))

        document.write(`O valor digitado foi <strong>${numero.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</strong>.`)
    </script>
</body>
</html>
