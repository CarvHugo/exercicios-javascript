<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu programa...</title>
    <style>
        body {
            background-color: rgb(44, 105, 85);
            color: white;
            font: normal 20pt Arial;
        }

        h1 {
            color: rgb(211, 211, 29);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição hehe</p>

    <script>
        let n1 = window.prompt("Digite um número.") // window.prompt() sempre retorna String
        let n2 = window.prompt("Digite outro número")

        n1 = Number.parseFloat(n1)
        n2 = Number.parseFloat(n2)

        const soma = n1 + n2

        window.alert(`A soma entre os números ${n1} e ${n2} é ${soma}`)
    </script>
</body>
</html>
